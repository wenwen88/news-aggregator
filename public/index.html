<!-- public/index.html -->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>新聞整合器（經濟日報 / 工商時報 / Yahoo / CMoney）</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", Arial; margin: 24px; background: #f6f7fb; color:#111; }
    .container { max-width: 980px; margin: 0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .card { background:#fff; border-radius:10px; padding:16px; box-shadow:0 6px 18px rgba(20,30,60,0.06); margin-bottom:16px; }
    input[type=date], input[type=text] { padding:8px 10px; border-radius:6px; border:1px solid #ddd; }
    button { padding:10px 14px; border-radius:8px; border:0; cursor:pointer; background:#0b74de; color:white; font-weight:600; }
    button.secondary { background:#6c757d; }
    .result-item { padding:12px; border-bottom:1px solid #f0f2f5; display:flex; gap:12px; align-items:flex-start;}
    .meta { font-size:12px; color:#666; }
    .title { font-weight:700; margin-bottom:6px; }
    .footer { margin-top:12px; display:flex; gap:8px; justify-content:flex-end; }
    .empty { text-align:center; color:#888; padding:24px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>新聞整合器 — 經濟日報 / 工商時報 / Yahoo / CMoney</h2>
      <small>輸入起訖日即可產生整合結果</small>
    </header>

    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <label>關鍵字：
          <input id="q" type="text" value="台股" />
        </label>
        <label>起日：
          <input id="start" type="date" />
        </label>
        <label>迄日：
          <input id="end" type="date" />
        </label>
        <button id="searchBtn">搜尋</button>
        <button id="exportBtn" class="secondary">匯出 CSV</button>
      </div>
    </div>

    <div id="results" class="card">
      <div id="summary" style="display:flex;justify-content:space-between;align-items:center;">
        <div id="info">請輸入日期後按搜尋。</div>
      </div>
      <div id="list"></div>
    </div>

    <div style="text-align:center;color:#888;font-size:13px;">
      注意：此工具為原型範例，實務使用請確認來源授權與站台政策。
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
